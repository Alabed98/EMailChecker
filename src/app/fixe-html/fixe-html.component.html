<div class="upload">

  <button class="fixe-btn" type="submit" (click)="fixeCode()"><i class="fa-solid fa-circle-check"></i> Code Korrigieren</button>


  <div class="wrapper">

    <mat-form-field appearance="fill" class="full-width code-field">
      <mat-label><i class="fa-brands fa-html5"></i> HTML-Code hochladen</mat-label>
      <textarea matInput [(ngModel)]="textarea" (ngModelChange)="fixeCode()" rows="10"></textarea>
    </mat-form-field>
  </div>
</div>
